name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Git Bash on the Windows runner, so globs and env-var syntax below
        # behave identically on both platforms.
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Run regression tests
        run: python -m unittest -v test_critical_fixes.py
      - name: Run regression tests on a legacy console code page
        if: runner.os == 'Windows'
        # Guards the bilingual entry points against UnicodeEncodeError when the
        # console cannot represent Chinese output (see console.py).
        env:
          PYTHONIOENCODING: cp1252
        run: python -m unittest -v test_critical_fixes.ConsoleEncodingTests
      - name: Compile package modules
        run: python -m compileall -q src/kokoro_tts_local
      - name: Build wheel
        if: runner.os == 'Linux'
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Verify installed namespace and entry points
        if: runner.os == 'Linux'
        run: |
          python -m pip install --no-deps dist/*.whl
          python -c "import importlib.metadata as m; d=m.distribution('kokoro-tts-local'); assert {e.name for e in d.entry_points} >= {'kokoro-tts', 'kokoro-tts-web', 'kokoro-tts-chinese', 'kokoro-tts-setup', 'kokoro-tts-check'}"
