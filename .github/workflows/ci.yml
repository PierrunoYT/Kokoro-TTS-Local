name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Run regression tests
        run: python -m unittest -v test_critical_fixes.py
      - name: Compile package modules
        run: python -m py_compile src/kokoro_tts_local/*.py
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Verify installed namespace and entry points
        run: |
          python -m pip install --no-deps dist/*.whl
          python -c "import importlib.metadata as m; d=m.distribution('kokoro-tts-local'); assert {e.name for e in d.entry_points} >= {'kokoro-tts', 'kokoro-tts-web', 'kokoro-tts-chinese', 'kokoro-tts-setup', 'kokoro-tts-check'}"
