services:
  kokoro-tts:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kokoro-tts-local
    ports:
      - "127.0.0.1:7860:7860"
    environment:
      # Set HF_HUB_OFFLINE=1 after the initial model download to run offline.
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"
      KOKORO_TTS_USERNAME: "${KOKORO_TTS_USERNAME:?KOKORO_TTS_USERNAME is required}"
      KOKORO_TTS_PASSWORD: "${KOKORO_TTS_PASSWORD:?KOKORO_TTS_PASSWORD is required}"
    volumes:
      - kokoro-data:/data
    restart: unless-stopped

volumes:
  kokoro-data:
