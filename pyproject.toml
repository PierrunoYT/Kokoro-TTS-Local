[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kokoro-tts-local"
version = "0.1.0"
description = "Local text-to-speech generation using the Kokoro-82M model, with CLI and Gradio web interfaces"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.13"
authors = [
    { name = "PierrunoYT" },
]
dependencies = [
    "kokoro",
    "misaki",
    "torch==2.14.0",
    "soundfile",
    "huggingface-hub",
    "gradio",
    "pydub",
    "espeakng-loader",
    "phonemizer-fork",
    "wheel",
    "setuptools>=83",
    "maturin",
    "num2words",
    "spacy",
    "tqdm",
    "psutil",
    "packaging",
    "numpy<2.0",
    "underthesea",
    "fugashi[unidic]",
    "jaconv",
    "mojimoji",
    "pyopenjtalk",
    "jamo",
    "cn2an",
    "jieba",
    "ordered-set",
    "pypinyin",
    "pypinyin-dict",
]

[project.urls]
Homepage = "https://github.com/PierrunoYT/Kokoro-TTS-Local"
Issues = "https://github.com/PierrunoYT/Kokoro-TTS-Local/issues"

[project.scripts]
kokoro-tts = "kokoro_tts_local.tts_demo:main"
kokoro-tts-web = "kokoro_tts_local.gradio_interface:main"
kokoro-tts-chinese = "kokoro_tts_local.chinese_tts_demo:main"
kokoro-tts-setup = "kokoro_tts_local.setup_chinese_tts:cli"
kokoro-tts-check = "kokoro_tts_local.dependency_checker:main"

[tool.setuptools.packages.find]
where = ["src"]
